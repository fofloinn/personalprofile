user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    server_tokens off;
    server {
        listen 8080;
        server_name fearghal.fnl.life;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
