user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;

    limit_req_zone $binary_remote_addr zone=public_requests:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_certificate /etc/letsencrypt/live/fearghal.fnl.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fearghal.fnl.life/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server {
        listen 8080 default_server;
        server_name _;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            try_files $uri =404;
        }
        location / {
            return 301 https://fearghal.fnl.life$request_uri;
        }
    }

    server {
        listen 8443 ssl default_server;
        server_name fearghal.fnl.life;
        if ($host != fearghal.fnl.life) { return 444; }
        if ($request_method !~ ^(GET|HEAD)$) { return 403; }
        if ($args ~* "(^|&)rest_route(=|&|$)") { return 403; }

        set $website_host fearghal.fnl.life;
        set $private_admin 0;
        limit_req zone=public_requests burst=30 nodelay;
        limit_conn connections 20;

        location ~* ^/(wp-admin|wp-json|wp-login|xmlrpc) { return 403; }
        location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 403; }
        location ~ (^|/)\. { return 403; }
        location ~* /(wp-config|readme\.html|license\.txt)|\.(sql|bak|log)$ { return 403; }

        location / {
            include /etc/nginx/website-proxy.conf;
        }
    }

    server {
        listen 8444 ssl;
        server_name fearghal.fnl.life;
        if ($host != fearghal.fnl.life) { return 444; }
        set $website_host fearghal.fnl.life:8443;
        set $private_admin 1;

        location ~* ^/xmlrpc\.php { return 403; }
        location ~ (^|/)\. { return 403; }
        location ~* /(wp-config\.php|wp-admin/setup-config\.php)|\.(sql|bak|log)$ { return 403; }
        location = /wp-login.php {
            limit_req zone=admin_login burst=5 nodelay;
            include /etc/nginx/website-proxy.conf;
        }
        location / {
            include /etc/nginx/website-proxy.conf;
        }
    }
}
