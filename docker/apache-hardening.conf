ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory "/var/www/html/wp-content/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "(?i)^(wp-config\.php|\.env|\.ht.*|.*\.(sql|bak|log))$">
    Require all denied
</FilesMatch>
